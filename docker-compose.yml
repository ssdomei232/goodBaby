services:
  goodbaby:
    image: mei232/goodbaby:v2.0.1
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data.db:/app/data.db:ro

networks:
  app-network:
    driver: bridge