services:
  goodbaby:
    image: mei232/goodbaby:v0.2.0
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    restart: unless-stopped
    networks:
      - app-network
    volumes:
      - ./config.json:/app/config.json:ro
      - ./tmp:/app/tmp

networks:
  app-network:
    driver: bridge