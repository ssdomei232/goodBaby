services:
  goodbaby:
    # 发版镜像由 GitHub Actions 自动推送到 ghcr
    image: ghcr.io/ssdomei232/goodbaby:latest
    # 想用本地源码构建时把上面一行注释掉，保留 build
    build: .
    ports:
      - "8088:8088"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    restart: unless-stopped
    volumes:
      # sqlite 需要写权限，config.json 首次启动会自动生成，不能挂成只读
      - ./data:/app/data
